<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - SoundWave</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: white;
        }

        nav {
            background: #000;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #00d9ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #00d9ff;
        }

        .enquiry {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px;
        }

        .form-box {
            background: #1c1c1c;
            padding: 40px;
            width: 500px;
            border-radius: 15px;
        }

        .form-box h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #00d9ff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;

        footer {
            background: #000;

            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>SoundWave</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="enquiry.html">Enquiry</a>
        </div>
    </nav>

    <section class="enquiry">

        <div class="form-box">

            <h1>Product Enquiry</h1>

            <form>

                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Phone</label>
                <input type="tel" placeholder="Enter your phone number">

                <label>Product</label>
                <select>
                    <option>SoundWave Pro</option>
                    <option>SoundWave Lite</option>
                    <option>SoundWave Gaming</option>
                    <option>Other</option>
                </select>

                <label>Message</label>
                <textarea placeholder="Enter your enquiry"></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </div>

    </section>

    <footer>
        <p>© 2026 SoundWave. All Rights Reserved.</p>
    </footer>

</body>
